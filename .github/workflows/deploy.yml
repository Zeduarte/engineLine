name: Deploy (Vercel)

# Deploy para a Vercel via CLI. ALTERNATIVA à integração Git nativa da Vercel
# (que é o caminho recomendado — ver README). Use este workflow se preferir
# controlar o deploy a partir do GitHub Actions.
#
# Requer os seguintes secrets no repositório
# (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — token pessoal da Vercel
#   VERCEL_ORG_ID       — id da organização/equipa (ficheiro .vercel/project.json)
#   VERCEL_PROJECT_ID   — id do projeto na Vercel
#
# As variáveis de ambiente da app (NEXT_PUBLIC_SUPABASE_URL, etc.) devem ser
# configuradas no painel da Vercel (Project → Settings → Environment Variables).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
