name: Deploy to GitHub Pages

# Publica o site (exportação estática do Next.js) no GitHub Pages a cada push
# para main. O link fica em https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para o deploy-pages autenticar via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez; não cancela um deploy a meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Regista a config de Pages e (se possível) ativa o Pages automaticamente.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          EXPORT: "true"
          # basePath = /<nome-do-repo>, exatamente o subcaminho do Pages.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
